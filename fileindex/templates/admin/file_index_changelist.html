{% extends "admin/change_list.html" %}
{% block content_title %}{% endblock %}
{% block object-tools %}
{% include "admin/_fileindex_styles.html" %}
<style>
    /* HIDE DJANGO'S DEFAULT TITLE ("Select file index to change") */
    #content > h1 { display: none !important; }
    /* OVERRIDE DJANGO'S DEFAULT FLOAT */
    #changelist .object-tools {
        float: none !important;
        position: relative !important;
        margin: 0 0 25px 0 !important;
        padding: 0 !important;
        width: 100% !important;
        display: block !important;
    }
    .scanner-wrap { max-width: 760px; padding: 10px 0; }
</style>

<div class="custom-tools-wrapper">
    <div class="scanner-wrap">
        <div class="premium-card">
            <div class="card-header">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
                System Drive Scanner
            </div>

            <label class="field-label">Select Drive or Folder</label>
            <select id="driveSelect" class="input-field">
                <option value="" disabled selected>-- Choose Target Location --</option>
                {% for key, label in scan_locations %}
                <option value="{{ key }}">{{ label }}</option>
                {% endfor %}
            </select>

            <div class="action-row">
                <button id="scanBtn" class="btn-primary"><span id="btnText">Start Background Scan</span></button>
                <div id="scanStatus" style="font-size: 14px; min-height: 20px; text-align: center; margin-top: 5px;"></div>
            </div>

            <a class="nav-link" href="{% url 'admin:fileindex_bulksearch_changelist' %}">Go to Bulk Number Search &rarr;</a>
        </div>
    </div>
</div>

<script>
(function () {
    const $ = (id) => document.getElementById(id);
    const csrf = '{{ csrf_token }}';
    const urls = {
        start: "{% url 'start_scan' %}",
        check: "{% url 'check_scan' 0 %}",
    };

    async function post(url, data) {
        const fd = new FormData();
        Object.entries(data).forEach(([k, v]) => fd.append(k, v));
        fd.append('csrfmiddlewaretoken', csrf);
        const res = await fetch(url, { method: 'POST', body: fd });
        const json = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(json.error || 'Request failed (' + res.status + ')');
        return json;
    }

    const scanBtn = $('scanBtn'), btnText = $('btnText'), statusEl = $('scanStatus');

    function setStatus(text, color) {
        statusEl.textContent = text;
        statusEl.style.color = color;
        statusEl.style.fontWeight = '600';
    }
    function resetScanBtn() {
        scanBtn.disabled = false;
        btnText.textContent = 'Start Background Scan';
    }

    function poll(taskId) {
        const url = urls.check.replace('/0/', '/' + taskId + '/');
        const timer = setInterval(async () => {
            try {
                const t = await (await fetch(url)).json();
                const counts = `${t.folders_scanned} folders · ${t.files_indexed} indexed · ${t.files_skipped} unchanged · ${t.files_failed} failed`;
                if (t.status === 'Running') {
                    setStatus(counts + (t.message ? ' — ' + t.message : ''), '#f29000');
                } else if (t.status === 'Completed') {
                    clearInterval(timer); resetScanBtn();
                    setStatus('✓ Done! ' + counts, '#28a745');
                    setTimeout(() => window.location.reload(), 3000);
                } else {
                    clearInterval(timer); resetScanBtn();
                    setStatus('⚠ Error: ' + (t.message || 'check server logs'), '#dc3545');
                }
            } catch (e) {
                clearInterval(timer); resetScanBtn();
                setStatus('⚠ Connection lost while checking scan status.', '#dc3545');
            }
        }, 2000);
    }

    scanBtn.addEventListener('click', async () => {
        const location = $('driveSelect').value;
        if (!location) { alert('Please select a drive or folder first!'); return; }

        scanBtn.disabled = true;
        btnText.textContent = 'Scanning in background...';
        setStatus('Starting scan...', '#f29000');
        try {
            const data = await post(urls.start, { location });
            poll(data.task_id);
        } catch (e) {
            resetScanBtn();
            setStatus('⚠ ' + e.message, '#dc3545');
        }
    });
})();
</script>
{% endblock %}
