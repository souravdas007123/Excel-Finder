{% load webui_tags %}
<div class="modal-head"><h3>Reset all data?</h3><button type="button" class="btn btn-ghost btn-sm" data-close-modal aria-label="Close">{% icon "x" 18 %}</button></div>
<form hx-post="{% url 'webui:scan_reset' %}" hx-swap="none">
    <div class="modal-body">
        <p>This removes <b>{{ files|comma }}</b> indexed file{{ files|pluralize }}, <b>{{ scans|comma }}</b> scan history entr{{ scans|pluralize:"y,ies" }} and your recent searches.</p>
        <p class="hint" style="margin-top:10px">Your Excel files on disk, your login and your license are <b>not</b> touched. This cannot be undone.</p>
        <label class="field" for="reset-confirm" style="margin-top:14px">Type <b>{{ word }}</b> to confirm</label>
        <input id="reset-confirm" name="confirm" type="text" autocomplete="off" placeholder="{{ word }}">
    </div>
    <div class="modal-foot">
        <button type="button" class="btn" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-danger">{% icon "trash" 15 %} <span class="spin"></span> Reset everything</button>
    </div>
</form>
