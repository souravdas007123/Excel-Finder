{% load static webui_tags %}<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password changed | Excel Finder</title>
<script>(function () { try { document.documentElement.setAttribute("data-theme", localStorage.getItem("ef-theme") === "light" ? "light" : "dark"); } catch (e) {} })();</script>

</head>
<body>
{% include "webui/partials/_icons.html" %}
<div class="auth">
    <div class="auth-card">
        <div class="brand"><span class="brand-mark">{% icon "files" 18 %}</span> Excel Finder</div>
        <h1>Password changed</h1>

    </div>
